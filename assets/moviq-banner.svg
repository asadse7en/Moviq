<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 420" width="1024" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tealglow" x="-300%" y="-10%" width="700%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="folder" viewBox="0 0 30 22" overflow="visible">
      <path d="M2 19V3a2 2 0 0 1 2-2h7l3 3h10a2 2 0 0 1 2 2v3"/>
      <path d="M2 19l4-10h22l-4 10z"/>
    </symbol>
    <symbol id="file" viewBox="0 0 20 24" overflow="visible">
      <path d="M3 1h9l6 6v15a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>
      <path d="M12 1v6h6"/>
    </symbol>
  </defs>

  <rect x="8" y="8" width="1008" height="404" rx="20" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <!-- Headers -->
  <g font-size="27" letter-spacing="2" fill="#5CC9B8" text-anchor="middle">
    <text x="270" y="56">BEFORE</text>
    <text x="790" y="56">AFTER</text>
  </g>

  <!-- Icons and connectors (orange, glow) -->
  <g stroke="#5CC9B8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- LEFT tree -->
    <use href="#folder" x="30" y="109" width="30" height="22"/>
    <path d="M44 134V280"/>
    <path d="M44 160H64"/>
    <path d="M44 220H64"/>
    <path d="M44 280H64"/>
    <use href="#file" x="66" y="148" width="20" height="24"/>
    <use href="#file" x="66" y="208" width="20" height="24"/>
    <use href="#file" x="66" y="268" width="20" height="24"/>

    <!-- RIGHT tree connectors -->
    <path d="M620 108V235"/>
    <path d="M620 130H643"/>
    <path d="M620 235H643"/>
    <path d="M658 142V165H681"/>
    <path d="M698 177V200H725"/>
    <path d="M658 247V270H681"/>
    <path d="M698 282V305H721"/>
    <path d="M738 317V340H763"/>

    <!-- RIGHT tree icons -->
    <use href="#folder" x="605" y="84" width="30" height="22"/>
    <use href="#folder" x="643" y="119" width="30" height="22"/>
    <use href="#folder" x="683" y="154" width="30" height="22"/>
    <use href="#file"   x="727" y="188" width="20" height="24"/>
    <use href="#folder" x="643" y="224" width="30" height="22"/>
    <use href="#folder" x="683" y="259" width="30" height="22"/>
    <use href="#folder" x="723" y="294" width="30" height="22"/>
    <use href="#file"   x="765" y="328" width="20" height="24"/>
  </g>

  <!-- Teal divider -->
  <line x1="580" y1="130" x2="580" y2="290" stroke="#5CC9B8" stroke-width="2.5" stroke-linecap="round" filter="url(#tealglow)"/>

  <!-- Left text -->
  <g font-size="17" fill="#1f2937">
    <text x="68" y="126">Downloads</text>
    <text x="98" y="166">Inception.2010.1080p.BluRay.x264.mkv</text>
    <text x="98" y="226">Breaking.Bad.S01E01.720p.BluRay.x264.mp4</text>
    <text x="98" y="286">Stranger.Things.S02E05.1080p.WEBrip.x264.mkv</text>
  </g>

  <!-- Right text -->
  <g font-size="18" fill="#1f2937">
    <text x="645" y="101">Media Library</text>
    <text x="683" y="136">Movies</text>
    <text x="723" y="171">Inception (2010)</text>
    <text x="761" y="206">Inception.mkv</text>
    <text x="683" y="241">TV Shows</text>
    <text x="723" y="276">Breaking Bad</text>
    <text x="761" y="311">Season 1</text>
    <text x="803" y="346">S01E01.mp4</text>
  </g>

  <text x="996" y="396" font-size="13" text-anchor="end" fill="#6b7280">MOVIQ | Media Renamer</text>
</svg>
